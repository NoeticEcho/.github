name: Bug
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, what happened instead. Paste the command and its output.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest steps that show it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release, tag or commit, and your OS.
